server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
    # 只用 Cookie 跟踪会话，避免重定向 URL 里被拼上 ;jsessionid=xxx
    session:
      tracking-modes: cookie
      timeout: 12h

spring:
  application:
    name: family-kids
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:ontobricks}?currentSchema=${DB_SCHEMA:family_kids}&stringtype=unspecified
    username: ${DB_USER:ontobricks}
    password: ${DB_PASSWORD:devpass}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 10000
      maximum-pool-size: 10
  thymeleaf:
    cache: false
    encoding: UTF-8
    mode: HTML
    suffix: .html
    prefix: classpath:/templates/
  sql:
    init:
      mode: never
  servlet:
    multipart:
      enabled: true
      max-file-size: 20MB
      max-request-size: 22MB
      file-size-threshold: 0

mybatis:
  configuration:
    map-underscore-to-camel-case: true
    default-executor-type: simple
    cache-enabled: true
  type-aliases-package: com.family.kids.entity
  mapper-locations: classpath:mapper/*.xml

logging:
  level:
    com.family.kids.mapper: debug
    org.springframework.jdbc: debug
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

app:
  default-operator: 家长
  # 外部头像目录（不在 classpath / jar 内，重新打包不会丢照片）
  # 可用环境变量 AVATAR_DIR 覆盖
  avatar-dir: ${AVATAR_DIR:C:/Users/PC/WorkBuddy/2026-10-17-22-41-15/family-kids/uploads/avatars}
