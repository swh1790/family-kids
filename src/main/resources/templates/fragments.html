<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head (title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#5B7CFA">
    <title th:text="${title} + ' · 家庭成长系统'">家庭成长系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/app.css?v=9}" rel="stylesheet">
</head>
<body>

<nav th:fragment="appNav" class="navbar navbar-expand-lg navbar-app">
    <div class="container-fluid px-3">
        <a class="navbar-brand" th:href="@{/}">🏫 家庭成长系统</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navMenu">
            <!-- 家长菜单：仅 PARENT 可见 -->
            <ul class="navbar-nav me-auto mb-2 mb-lg-0" th:if="${loginUser != null and loginUser.role == 'PARENT'}">
                <li class="nav-item"><a class="nav-link" th:href="@{/}">控制台</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/tasks}">今日任务</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/tasks/templates}">任务模板</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/habits}">习惯扣分</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/pets}">灵宠</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/rewards}">奖励商城</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/points}">积分流水</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/report}">统计报表</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/board}">客厅看板</a></li>
            </ul>

            <!-- 右侧：身份 + 退出登录 -->
            <ul class="navbar-nav ms-auto mb-2 mb-lg-0 align-items-lg-center">
                <li class="nav-item" th:if="${loginUser != null}">
                    <span class="navbar-text pe-3">
                        <span th:text="${loginUser.displayName}">用户</span>
                        <span class="badge bg-primary ms-1"
                              th:text="${loginUser.role == 'PARENT' ? '家长' : '孩子'}">身份</span>
                    </span>
                </li>
                <li class="nav-item" th:if="${loginUser != null}">
                    <a class="nav-link" th:href="@{/logout}">退出登录</a>
                </li>
                <li class="nav-item" th:if="${loginUser == null}">
                    <a class="nav-link" th:href="@{/login}">登录</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<!-- 孩子端简化导航：只有主页入口和「退出登录」 -->
<nav th:fragment="kidnav" class="navbar navbar-expand-lg navbar-app">
    <div class="container-fluid px-3">
        <!-- 孩子看自己：🎒 名字 的主页；家长查看：👀 孩子的名字 -->
        <a class="navbar-brand"
           th:href="@{/kid/{id}(id=${loginUser != null and loginUser.childId != null ? loginUser.childId : (child != null ? child.id : 1)})}"
           th:text="${loginUser != null and loginUser.role == 'PARENT'
                     ? '👀 ' + (child != null ? child.name : '孩子') + ' 的主页'
                     : '🎒 ' + (loginUser != null ? loginUser.displayName : '我的') + ' 的主页'}">🎒 我的主页</a>
        <ul class="navbar-nav ms-auto align-items-lg-center">
            <li class="nav-item" th:if="${loginUser != null and loginUser.role == 'PARENT'}">
                <a class="nav-link" th:href="@{/}">返回控制台</a>
            </li>
            <li class="nav-item" th:if="${child != null}">
                <span class="navbar-text pe-3">
                    <span class="badge bg-primary" th:text="${child.grade}">年级</span>
                </span>
            </li>
            <li class="nav-item">
                <a class="nav-link" th:href="@{/logout}">退出登录</a>
            </li>
        </ul>
    </div>
</nav>

<!-- 全局提示条：展示控制器通过 RedirectAttributes 传回的 msg / error -->
<div th:fragment="alerts" class="container-fluid px-3 pt-3">
    <div th:if="${msg}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${msg}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
</div>

<footer th:fragment="scripts">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <script th:src="@{/js/app.js}"></script>
</footer>

</body>
</html>
