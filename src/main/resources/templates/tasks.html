<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('今日任务')}"></head>
<body>
<nav th:replace="~{fragments :: appNav}"></nav>
<div th:replace="~{fragments :: alerts}"></div>

<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>📋 今日任务</h2>
        <div class="d-flex align-items-center toolbar">
            <form method="get" th:action="@{/tasks}" class="d-flex align-items-center me-2">
                <input type="date" name="date" class="form-control" th:value="${date}">
                <select name="childId" class="form-select ms-2">
                    <option value="">全部孩子</option>
                    <option th:each="c : ${children}" th:value="${c.id}" th:text="${c.name}"
                            th:selected="${c.id == selectedChildId}">孩子</option>
                </select>
                <button type="submit" class="btn btn-outline-primary ms-2 text-nowrap flex-shrink-0">查询</button>
            </form>
            <form method="post" th:action="@{/tasks/generate}" class="d-flex align-items-center">
                <input type="hidden" name="date" th:value="${date}">
                <button type="submit" class="btn btn-primary">🚀 生成今日任务</button>
            </form>
            <button class="btn btn-success ms-2" data-bs-toggle="modal" data-bs-target="#addTaskModal">➕ 临时任务</button>
        </div>
    </div>


    <div class="table-responsive bg-white rounded shadow-sm">
        <table class="table table-hover align-middle">
            <thead class="table-light">
            <tr>
                <th>孩子</th>
                <th>分类</th>
                <th>任务</th>
                <th>积分</th>
                <th>状态</th>
                <th>来源</th>
                <th>操作</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="t : ${tasks}">
                <td>
                    <span th:text="${t.childAvatar}">👦</span>
                    <span th:text="${t.childName}">名字</span>
                </td>
                <td>
                    <span th:text="${t.categoryIcon}">📚</span>
                    <span th:text="${t.categoryName}">分类</span>
                </td>
                <td th:text="${t.title}">任务名</td>
                <td th:text="'+' + ${t.points}">+5</td>
                <td>
                    <span class="badge"
                          th:classappend="${t.status == 'PENDING' ? 'bg-secondary' :
                                           (t.status == 'DONE' ? 'bg-warning text-dark' :
                                           (t.status == 'APPROVED' ? 'bg-success' : 'bg-danger'))}"
                          th:text="${t.status == 'PENDING' ? '待完成' :
                                    (t.status == 'DONE' ? '待确认' :
                                    (t.status == 'APPROVED' ? '已通过' : '已驳回'))}">状态</span>
                </td>
                <td th:text="${t.source == 'AUTO' ? '自动生成' : '手动添加'}">来源</td>
                <td>
                    <form th:action="@{/tasks/{id}/approve(id=${t.id})}" method="post" class="d-inline"
                          th:if="${t.status == 'DONE' or t.status == 'PENDING' or t.status == 'REJECTED'}">
                        <input type="hidden" name="date" th:value="${date}">
                        <button type="submit" class="btn btn-sm btn-success">通过</button>
                    </form>
                    <form th:action="@{/tasks/{id}/reject(id=${t.id})}" method="post" class="d-inline"
                          th:if="${t.status == 'DONE' or t.status == 'PENDING'}">
                        <input type="hidden" name="date" th:value="${date}">
                        <button type="submit" class="btn btn-sm btn-outline-danger">驳回</button>
                    </form>
                    <form th:action="@{/tasks/{id}/delete(id=${t.id})}" method="post" class="d-inline">
                        <input type="hidden" name="date" th:value="${date}">
                        <button type="submit" class="btn btn-sm btn-outline-secondary">删除</button>
                    </form>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(tasks)}">
                <td colspan="7" class="text-center text-muted py-4">当天还没有任务，点击“生成今日任务”。</td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

<!-- 添加临时任务 Modal -->
<div class="modal fade" id="addTaskModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <form method="post" th:action="@{/tasks/add}">
                <div class="modal-header">
                    <h5 class="modal-title">添加临时任务</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label">孩子</label>
                        <select name="childId" class="form-select" required>
                            <option th:each="c : ${children}" th:value="${c.id}" th:text="${c.name}">孩子</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">分类</label>
                        <select name="categoryId" class="form-select" required>
                            <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.name}">分类</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">任务名称</label>
                        <input type="text" name="title" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">积分</label>
                        <input type="number" name="points" class="form-control" value="5" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">日期</label>
                        <input type="date" name="planDate" class="form-control" th:value="${date}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">备注</label>
                        <input type="text" name="remark" class="form-control">
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                    <button type="submit" class="btn btn-primary">保存</button>
                </div>
            </form>
        </div>
    </div>
</div>

<div th:replace="~{fragments :: scripts}"></div>
</body>
</html>
